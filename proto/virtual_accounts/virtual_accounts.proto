syntax = "proto3";

package cloud9.virtual_accounts;

option go_package = "github.com/Cloud9Money/api-protos/proto/virtual_accounts;virtualaccountspb";

// VirtualAccountService exposes virtual account operations to internal services.
service VirtualAccountService {
  // GetVirtualAccountDepositInstructions returns the deposit instructions needed to fund an account from fiat.
  rpc GetVirtualAccountDepositInstructions(GetVirtualAccountDepositInstructionsRequest) returns (GetVirtualAccountDepositInstructionsResponse);
}

message GetVirtualAccountDepositInstructionsRequest {
  string entity_id = 1;
  string currency = 2;
}

message GetVirtualAccountDepositInstructionsResponse {
  string virtual_account_id       = 1;
  string currency                 = 2;
  string bank_name                = 3;
  string bank_address             = 4;
  string bank_routing_number      = 5;
  string bank_account_number      = 6;
  string bank_beneficiary_name    = 7;
  string bank_beneficiary_address = 8;
  repeated string payment_rails   = 9;

  // EUR-only (IBAN/BIC rail)
  string iban                = 10;
  string bic                 = 11;
  string account_holder_name = 12;

  // GBP-only (Faster Payments rail)
  string account_number = 13;
  string sort_code       = 14;
}
